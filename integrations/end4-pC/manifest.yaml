name: end4-pC
version: "1.0.0"
type: quickshell
description: "Material 3 Quickshell desktop shell reference integration for kali-land"
provenance: "https://github.com/pctrade/end4-pC"

entry: "shell.qml"

requires:
  capabilities:
    - wayland
    - hyprland
    - quickshell
  packages:
    - qml6-module-qtcore
    - qml6-module-qtqml
    - qml6-module-qtqml-workerscript
    - qml6-module-qtquick
    - qml6-module-qtquick-controls
    - qml6-module-qtquick-layouts
    - qml6-module-qtquick-templates
    - qml6-module-qtquick-window
    - qml6-module-qtquick-shapes
    - qml6-module-qtquick-effects
    - qml6-module-qt5compat-graphicaleffects
    - qml6-module-qtpositioning
    - qml6-module-qt-labs-platform
    - qml6-module-qt-labs-folderlistmodel
    - qml6-module-qt-labs-settings
    - qml6-module-qt-labs-synchronizer
    - qml6-module-qt-labs-qmlmodels
    - qml6-module-qt-labs-animation
    - qml6-module-org-kde-syntaxhighlighting
    - qml6-module-org-kde-kirigami
    - libkf6syntaxhighlighting6
    - libqt6core5compat6
    - libqt6svg6
    - power-profiles-daemon
    - brightnessctl
    - playerctl
    - libnotify-bin

optional:
  capabilities:
    - pipewire
    - wireplumber
    - networkmanager
    - notifications
    - portals
    - polkit
    - clipboard
    - screenshot
    - lock
    - idle
    - bluetooth
    - battery
    - brightness

environment:
  QT_QUICK_BACKEND: "software" # recommended for VMware compatibility
  QS_CONFIG: "end4-pC"
