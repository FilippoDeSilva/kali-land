name: Build Installer

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build-installer:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Create installer package
      run: |
        tar -czf kali-land-installer.tar.gz \
          bootstrap/ \
          config/ \
          integrations/ \
          profiles/ \
          packages/ \
          scripts/ \
          docs/ \
          AGENT.md \
          README.md \
          LICENSE \
          QUICKSTART.md

    - name: Upload installer artifact
      uses: actions/upload-artifact@v4
      with:
        name: kali-land-installer
        path: kali-land-installer.tar.gz
        retention-days: 30

    - name: Upload to release (if release or tag)
      if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.ref_name }}
        files: kali-land-installer.tar.gz
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}