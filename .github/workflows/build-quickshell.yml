name: Build Quickshell

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build-quickshell:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    container:
      image: kalilinux/kali-rolling:latest

    env:
      DEBIAN_FRONTEND: noninteractive
      CPPTRACE_REF: v0.7.3
      QUICKSHELL_REF: v0.4.0
      MATUGEN_VERSION: 0.16.0

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Install build dependencies
      run: |
        apt-get update
        apt-get install -y --no-install-recommends \
          ca-certificates \
          curl \
          git \
          cmake \
          ninja-build \
          build-essential \
          qt6-base-dev \
          qt6-base-private-dev \
          qt6-declarative-dev \
          qt6-declarative-private-dev \
          qt6-wayland-dev \
          qt6-wayland-private-dev \
          qt6-shadertools-dev \
          qt6-tools-dev \
          qt6-scxml-dev \
          extra-cmake-modules \
          libqt6waylandclient6 \
          libcli11-dev \
          libdrm-dev \
          libgbm-dev \
          libxcb1-dev \
          libpipewire-0.3-dev \
          libpam0g-dev \
          libpolkit-gobject-1-dev \
          libpolkit-agent-1-dev \
          libglib2.0-dev \
          pkg-config \
          spirv-tools \
          libvulkan-dev \
          libjemalloc-dev \
          libdwarf-dev \
          libunwind-dev \
          wayland-protocols \
          libwayland-dev \
          libegl-dev \
          libgl-dev \
          cargo \
          rustc

    - name: Build and install cpptrace
      run: |
        git clone --branch ${{ env.CPPTRACE_REF }} https://github.com/jeremy-rifkin/cpptrace.git /tmp/cpptrace || git clone https://github.com/jeremy-rifkin/cpptrace.git /tmp/cpptrace
        cd /tmp/cpptrace
        mkdir -p build && cd build
        cmake -GNinja -DCMAKE_BUILD_TYPE=Release -DCPPTRACE_UNWIND_WITH_LIBUNWIND=ON -DCPPTRACE_GET_BACKTRACE_WITH_LIBUNWIND=ON ..
        ninja
        cmake --install .

    - name: Clone Quickshell repository
      run: |
        git clone --recursive --branch ${{ env.QUICKSHELL_REF }} https://github.com/outfoxxed/quickshell.git || git clone --recursive https://github.com/outfoxxed/quickshell.git quickshell

    - name: Build Quickshell
      run: |
        cd quickshell
        mkdir -p build && cd build
        cmake -GNinja -DCMAKE_BUILD_TYPE=Release -DDISTRIBUTOR="kali-land" ..
        ninja

    - name: Create Quickshell package
      run: |
        cd quickshell/build
        QUICKSHELL_BIN=$(find . -name quickshell -type f -executable | head -n 1)
        if [ -z "$QUICKSHELL_BIN" ]; then
          echo "Error: quickshell binary not found"
          exit 1
        fi
        cp "$QUICKSHELL_BIN" ./quickshell
        tar -czf quickshell-linux-x86_64.tar.gz quickshell
        sha256sum quickshell-linux-x86_64.tar.gz > quickshell-linux-x86_64.tar.gz.sha256
        cp quickshell-linux-x86_64.tar.gz ${{ github.workspace }}/quickshell-linux-x86_64.tar.gz
        cp quickshell-linux-x86_64.tar.gz.sha256 ${{ github.workspace }}/quickshell-linux-x86_64.tar.gz.sha256

    - name: Build Matugen
      run: |
        cargo install matugen --version ${{ env.MATUGEN_VERSION }} --root /tmp/matugen-root || cargo install matugen --root /tmp/matugen-root
        cd /tmp/matugen-root/bin
        tar -czf matugen-linux-x86_64.tar.gz matugen
        sha256sum matugen-linux-x86_64.tar.gz > matugen-linux-x86_64.tar.gz.sha256
        cp matugen-linux-x86_64.tar.gz ${{ github.workspace }}/matugen-linux-x86_64.tar.gz
        cp matugen-linux-x86_64.tar.gz.sha256 ${{ github.workspace }}/matugen-linux-x86_64.tar.gz.sha256

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: quickshell-and-matugen-binaries
        path: |
          quickshell-linux-x86_64.tar.gz
          quickshell-linux-x86_64.tar.gz.sha256
          matugen-linux-x86_64.tar.gz
          matugen-linux-x86_64.tar.gz.sha256
        retention-days: 30

    - name: Upload to release (if release or tag)
      if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.ref_name }}
        files: |
          quickshell-linux-x86_64.tar.gz
          quickshell-linux-x86_64.tar.gz.sha256
          matugen-linux-x86_64.tar.gz
          matugen-linux-x86_64.tar.gz.sha256
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}