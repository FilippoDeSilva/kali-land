name: Build Quickshell

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build-quickshell:
    runs-on: ubuntu-latest
    container:
      image: kalilinux/kali-rolling:latest

    env:
      DEBIAN_FRONTEND: noninteractive

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Install build dependencies
      run: |
        apt-get update
        apt-get install -y --no-install-recommends \
          ca-certificates \
          curl \
          git \
          cmake \
          ninja-build \
          build-essential \
          qt6-base-dev \
          qt6-base-private-dev \
          qt6-declarative-dev \
          qt6-declarative-private-dev \
          qt6-wayland-dev \
          qt6-wayland-private-dev \
          qt6-shadertools-dev \
          qt6-tools-dev \
          qt6-scxml-dev \
          extra-cmake-modules \
          libqt6waylandclient6 \
          libcli11-dev \
          libdrm-dev \
          libgbm-dev \
          libxcb1-dev \
          libpipewire-0.3-dev \
          libpam0g-dev \
          libpolkit-gobject-1-dev \
          libpolkit-agent-1-dev \
          libglib2.0-dev \
          pkg-config \
          spirv-tools \
          libvulkan-dev \
          libjemalloc-dev

    - name: Clone Quickshell repository
      run: |
        git clone --recursive https://github.com/outfoxxed/quickshell.git

    - name: Build Quickshell
      run: |
        cd quickshell
        mkdir -p build && cd build
        cmake -GNinja -DCMAKE_BUILD_TYPE=Release -DDISTRIBUTOR="kali-land" ..
        ninja

    - name: Create Quickshell package
      run: |
        cd quickshell/build
        tar -czf quickshell-linux-x86_64.tar.gz quickshell

    - name: Upload Quickshell artifact
      uses: actions/upload-artifact@v4
      with:
        name: quickshell-linux-x86_64
        path: quickshell/build/quickshell-linux-x86_64.tar.gz
        retention-days: 30

    - name: Upload to release (if release)
      if: github.event_name == 'release'
      uses: softprops/action-gh-release@v2
      with:
        files: quickshell/build/quickshell-linux-x86_64.tar.gz
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}