<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <!-- Map Google Sans Flex to Inter / Roboto / DejaVu Sans -->
  <match target="pattern">
    <test qual="any" name="family"><string>Google Sans Flex</string></test>
    <edit name="family" mode="assign" binding="same"><string>Inter</string></edit>
  </match>

  <!-- Map Readex Pro to Inter -->
  <match target="pattern">
    <test qual="any" name="family"><string>Readex Pro</string></test>
    <edit name="family" mode="assign" binding="same"><string>Inter</string></edit>
  </match>

  <!-- Map Space Grotesk to Inter -->
  <match target="pattern">
    <test qual="any" name="family"><string>Space Grotesk</string></test>
    <edit name="family" mode="assign" binding="same"><string>Inter</string></edit>
  </match>

  <!-- Map JetBrains Mono NF to JetBrains Mono -->
  <match target="pattern">
    <test qual="any" name="family"><string>JetBrains Mono NF</string></test>
    <edit name="family" mode="assign" binding="same"><string>JetBrains Mono</string></edit>
  </match>

  <!-- Default sans-serif fallback -->
  <alias>
    <family>sans-serif</family>
    <prefer>
      <family>Inter</family>
      <family>Roboto</family>
      <family>DejaVu Sans</family>
    </prefer>
  </alias>
</fontconfig>
