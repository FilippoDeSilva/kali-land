# Foot Terminal Configuration - Kali-Land
# Optimized for Wayland, Hyprland, and Kali Linux aesthetics

term=foot
font=JetBrains Mono Nerd Font:size=11, FiraCode Nerd Font:size=11, monospace:size=11
font-bold=JetBrains Mono Nerd Font:style=Bold:size=11
font-italic=JetBrains Mono Nerd Font:style=Italic:size=11
pad=12x12

[cursor]
style=block
color=0f141d 00d2ff
blink=yes

[mouse]
hide-when-typing=yes

[colors]
alpha=0.92
background=0f141d
foreground=e6edf3

## Normal colors
regular0=161b22  # black
regular1=ff0055  # red
regular2=00e676  # green
regular3=ffb703  # yellow
regular4=00d2ff  # blue (Kali Cyan)
regular5=b5179e  # magenta
regular6=00a896  # cyan (Kali Teal)
regular7=e6edf3  # white

## Bright colors
bright0=21262d   # bright black
bright1=ff3377   # bright red
bright2=33eb91   # bright green
bright3=ffc533   # bright yellow
bright4=33dcff   # bright blue
bright5=c645b2   # bright magenta
bright6=33b9aa   # bright cyan
bright7=ffffff   # bright white

[csd]
preferred=server
size=0
