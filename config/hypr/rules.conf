# Window rules
# These rules control how different types of windows behave
# Using new Hyprland syntax with match: prefix

# Make floating windows float
windowrule = match:class ^(pavucontrol)$, float
windowrule = match:class ^(nm-connection-editor)$, float
windowrule = match:class ^(blueman-manager)$, float
windowrule = match:class ^(org.gnome.Calculator)$, float
windowrule = match:class ^(org.gnome.Calendar)$, float
windowrule = match:class ^(org.gnome.Settings)$, float

# Make dialog windows float
windowrule = match:class ^(dialog)$, float
windowrule = match:class ^(file_progress)$, float
windowrule = match:class ^(notification)$, float
windowrule = match:class ^(splash)$, float
windowrule = match:class ^(confirm)$, float

# Center floating windows
windowrule = match:class ^(pavucontrol)$, center
windowrule = match:class ^(nm-connection-editor)$, center
windowrule = match:class ^(blueman-manager)$, center

# Set window sizes for specific applications
windowrule = match:class ^(pavucontrol)$, size 800 600
windowrule = match:class ^(nm-connection-editor)$, size 600 400

# Make windows ignore workspace rules
windowrule = match:class ^(steam)$, workspace special

# Pin windows to all workspaces
windowrule = match:class ^(discord)$, pin
windowrule = match:class ^(Spotify)$, pin

# Prevent window tiling for specific applications
windowrule = match:title ^(Picture-in-Picture)$, float
windowrule = match:title ^(Picture-in-Picture)$, noborder

# Set opacity for inactive windows
windowrule = match:class ^(.*), opacity 0.8 0.8

# Focus rules
windowrule = match:class ^(.*), focusonactivate
windowrule = match:class ^(firefox)$, stayfocused