# Window rules
# Using Hyprland v0.56.2 syntax (August 2026)
# The new format uses named rules with match and effect sections

# Make floating windows float
windowrule {
    name = "float-pavucontrol"
    match = { class = "pavucontrol" }
    float = true
}
windowrule {
    name = "float-nm-connection-editor"
    match = { class = "nm-connection-editor" }
    float = true
}
windowrule {
    name = "float-blueman-manager"
    match = { class = "blueman-manager" }
    float = true
}
windowrule {
    name = "float-gnome-calculator"
    match = { class = "org.gnome.Calculator" }
    float = true
}
windowrule {
    name = "float-gnome-calendar"
    match = { class = "org.gnome.Calendar" }
    float = true
}
windowrule {
    name = "float-gnome-settings"
    match = { class = "org.gnome.Settings" }
    float = true
}

# Make dialog windows float
windowrule {
    name = "float-dialog"
    match = { class = "dialog" }
    float = true
}
windowrule {
    name = "float-file-progress"
    match = { class = "file_progress" }
    float = true
}
windowrule {
    name = "float-notification"
    match = { class = "notification" }
    float = true
}
windowrule {
    name = "float-splash"
    match = { class = "splash" }
    float = true
}
windowrule {
    name = "float-confirm"
    match = { class = "confirm" }
    float = true
}

# Center floating windows
windowrule {
    name = "center-pavucontrol"
    match = { class = "pavucontrol" }
    center = true
}
windowrule {
    name = "center-nm-connection-editor"
    match = { class = "nm-connection-editor" }
    center = true
}
windowrule {
    name = "center-blueman-manager"
    match = { class = "blueman-manager" }
    center = true
}

# Set window sizes for specific applications
windowrule {
    name = "size-pavucontrol"
    match = { class = "pavucontrol" }
    size = { 800, 600 }
}
windowrule {
    name = "size-nm-connection-editor"
    match = { class = "nm-connection-editor" }
    size = { 600, 400 }
}

# Make windows ignore workspace rules
windowrule {
    name = "workspace-steam"
    match = { class = "steam" }
    workspace = "special"
}

# Pin windows to all workspaces
windowrule {
    name = "pin-discord"
    match = { class = "discord" }
    pin = true
}
windowrule {
    name = "pin-spotify"
    match = { class = "Spotify" }
    pin = true
}

# Prevent window tiling for specific applications
windowrule {
    name = "float-pip"
    match = { title = "Picture-in-Picture" }
    float = true
}
windowrule {
    name = "noborder-pip"
    match = { title = "Picture-in-Picture" }
    noborder = true
}

# Set opacity for inactive windows
windowrule {
    name = "opacity-inactive"
    match = { class = ".*" }
    opacity = { 0.8, 0.8 }
}

# Focus rules
windowrule {
    name = "focusonactivate-all"
    match = { class = ".*" }
    focusonactivate = true
}
windowrule {
    name = "stayfocused-firefox"
    match = { class = "firefox" }
    stayfocused = true
}