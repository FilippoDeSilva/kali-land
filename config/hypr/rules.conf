# Window rules
# These rules control how different types of windows behave

# Make floating windows float
windowrule = float, class:^(pavucontrol)$
windowrule = float, class:^(nm-connection-editor)$
windowrule = float, class:^(blueman-manager)$
windowrule = float, class:^(org.gnome.Calculator)$
windowrule = float, class:^(org.gnome.Calendar)$
windowrule = float, class:^(org.gnome.Settings)$

# Make dialog windows float
windowrule = float, class:^(dialog)$
windowrule = float, class:^(file_progress)$
windowrule = float, class:^(notification)$
windowrule = float, class:^(splash)$
windowrule = float, class:^(confirm)$

# Center floating windows
windowrule = center, class:^(pavucontrol)$
windowrule = center, class:^(nm-connection-editor)$
windowrule = center, class:^(blueman-manager)$

# Set window sizes for specific applications
windowrule = size 800 600, class:^(pavucontrol)$
windowrule = size 600 400, class:^(nm-connection-editor)$

# Make windows ignore workspace rules
windowrule = workspace special, class:^(steam)$

# Pin windows to all workspaces
windowrule = pin, class:^(discord)$
windowrule = pin, class:^(Spotify)$

# Prevent window tiling for specific applications
windowrule = float, title:^(Picture-in-Picture)$
windowrule = noborder, title:^(Picture-in-Picture)$

# Set opacity for inactive windows
windowrule = opacity 0.8 0.8, class:^(.*)

# Focus rules
windowrule = focusonactivate, class:^(.*)
windowrule = stayfocused, class:^(firefox)$