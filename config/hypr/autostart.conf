# Autostart applications and services

# Set wallpaper (using a simple color for now)
exec = hyprctl setcursor Catppuccin-Mocha-Lavender 24

# Start desktop services
exec = dunst &
exec = nm-applet &
exec = blueman-applet &
exec = wlsunset -l 20:00 -L 4500 -t 23:00 -T 3000 &

# Start Quickshell
exec = quickshell &

# Start clipboard manager
exec = wl-paste --type text --watch cliphist store &
exec = wl-paste --type image --watch cliphist store &

# Start idle manager
exec = swayidle -w timeout 300 'swaylock -f -c 000000' timeout 600 'hyprctl dispatch dpms off' resume 'hyprctl dispatch dpms on' before-sleep 'swaylock -f -c 000000' &

# Start polkit agent
exec = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1 &

# Enable notifications
exec = hyprctl setprop monitor eDP-1 enabled true