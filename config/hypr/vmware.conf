# VMware-specific configuration for stability

# Disable GPU-intensive features that may cause crashes in VMware
decoration {
    rounding = 2
    drop_shadow = false
    blur {
        enabled = false
    }
}

# Very simple animations for stability
animations {
    enabled = true
    animation = windows, 1, 3, default
    animation = windowsOut, 1, 3, default
    animation = border, 1, 5, default
    animation = fade, 1, 4, default
    animation = workspaces, 1, 3, default
}

# Use conservative rendering
renderer {
    force_intel = 0
}

# Disable variable refresh rate for stability
misc {
    vfr = false
    vrr = 0
}

# Conservative gaps
gaps_in = 3
gaps_out = 8
border_size = 1

# Reduce system load
misc {
    mouse_move_enables_dpms = false
    key_press_enables_dpms = false
    disable_autoreload = false
    no_direct_scanout = false
}