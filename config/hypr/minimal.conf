# Minimal Hyprland configuration for maximum stability on VMware

# Basic configuration
input {
    kb_layout = us
    follow_mouse = 1
    sensitivity = 0
    touchpad {
        natural_scroll = false
    }
}

# Very minimal decoration
decoration {
    rounding = 0
    drop_shadow = false
    blur {
        enabled = false
    }
}

# Disable all animations
animations {
    enabled = false
}

# No gaps
gaps_in = 0
gaps_out = 0
border_size = 1

# No special effects
misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
    disable_autoreload = true
    vfr = false
}

# Basic tiling only
general {
    border_size = 1
    gaps_in = 0
    gaps_out = 0
    layout = dwindle
}

# Most minimal renderer settings
renderer {
    force_intel = 0
}